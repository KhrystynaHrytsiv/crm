services:
    backend:
        build:
            context: .
            dockerfile: backend/Dockerfile
        ports:
            - "4000:4000"
        env_file:
            - backend/.env
        restart: on-failure

    frontend:
        build:
            context: .
            dockerfile: frontend/Dockerfile
            args:
                NEXT_PUBLIC_API_URL: http://localhost:4000
        ports:
            - "3000:3000"
        depends_on:
            - backend
        restart: on-failure
